name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  legacy:
    name: Legacy Fuse 7 scenarios (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11 is the Fuse 7.13 runtime; 21 shows the bundle also builds on a current JDK.
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Run golden-file scenarios against the Blueprint route
        run: mvn --batch-mode --no-transfer-progress -pl scenario-harness,legacy-fuse7 -am verify

  modern:
    name: Camel 4 on Quarkus scenarios (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the same golden-file scenarios against the Camel 4 application
        run: mvn --batch-mode --no-transfer-progress -pl scenario-harness,modern-quarkus -am verify
      - name: Build the container image
        run: docker build -f modern-quarkus/src/main/docker/Dockerfile.jvm -t shipment-status:ci modern-quarkus

  manifests:
    name: OpenShift manifests render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render base and dev overlay with Kustomize
        run: |
          kubectl kustomize openshift/base > /dev/null
          kubectl kustomize openshift/overlays/dev

  equivalence:
    name: Mapping carried over unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The XSLT mappings must be identical in both implementations
        run: diff -r legacy-fuse7/src/main/resources/xslt modern-quarkus/src/main/resources/xslt
