name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  legacy:
    name: Legacy Fuse 7 scenarios (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11 is the Fuse 7.13 runtime; 21 shows the bundle also builds on a current JDK.
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Run golden-file scenarios against the Blueprint route
        run: mvn --batch-mode --no-transfer-progress -pl scenario-harness,legacy-fuse7 -am verify
