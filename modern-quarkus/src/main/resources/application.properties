# Was: etc/nl.itqaanconsulting.logistics.shipmentstatus.cfg (Config Admin).
# Every key can be overridden by an environment variable, e.g. JMS_BROKER_URL or REGISTRY_URL.
quarkus.application.name=shipment-status

camel.main.routes-include-pattern=classpath:camel/shipment-status.xml

jms.broker-url=tcp://amq-broker:61616
jms.username=admin
jms.password=admin

queue.in=carrier.status.in
queue.invalid=carrier.status.invalid
queue.dlq=carrier.status.dlq

registry.url=http://shipment-registry:8080/registry
tracktrace.authority=track-trace:8080

# Camel 4 http uses Apache HttpClient 5, which retries 503/429 responses on its own.
# On top of the Camel redelivery policy that doubled the calls to an already overloaded
# Track and Trace (caught by the tracktrace-unavailable scenario). Camel alone decides on retries.
camel.component.http.automatic-retries-disabled=true

delivery.maximum-redeliveries=2
delivery.redelivery-delay=1000
delivery.back-off-multiplier=2

# Route-level metrics (exchanges, failures, processing time) at /q/metrics;
# Camel Quarkus enables the route policy by default (quarkus.camel.metrics.enable-route-policy).

%test.delivery.redelivery-delay=50
